  - title: Tech Stack
    layout: text
    content: | # this will include new lines to allow paragraphs
    

      - Python : 데이터 처리 및 AI 파이프라인 설계, 클래스 기반 모듈화 경험

      - Data Analysis
        - pandas : 데이터 정제, 집계, feature engineering 수행 가능
        - scikit-learn : 모델링 및 검증, 튜닝까지 end-to-end 수행 가능

      - Database
        - MySQL : 관계형 데이터 구조를 활용한 데이터 통합 및 분석용 dataset 생성

      - AI / NLP
        - OpenAI GPT API : 텍스트 교정, 요약, 분류 파이프라인 구성
        - Whisper : STT 및 timestamp 기반 후처리
        - BERTScore : semantic similarity 기반 문장 선택

      - System / Pipeline
        - Pipeline Architecture : end-to-end AI 서비스 설계 및 구현
        - FFmpeg : 영상 처리 자동화 (클립 생성, 병합, 효과 적용)
        
      - Backend
        - Django : 

        
      - TensorFlow :
      - Pytorch : 기본적인 동작 원리와 텍스트 정제를 위한 seq-to-seq 모델링 실행 경험 존재
    


