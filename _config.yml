  - title: Projects # Title for the section # 이걸 두 개 만들어야겠네, 하나는 스트림릿 리팩토링, 하나는 숏폼 생성 리팩토링으로
    layout: list # Type of content section (list/text)
    content:
      - layout: top-middle
        title: 실험 자동화를 적용한 ML 기반 인터넷 유형 예측 시스템 리팩토링
        link: https://github.com/jskimofs/streamlit_internet_recommender # 여기다가 stl이랑 숏폼 하나씩 넣어두면 되겠다
        # link_text: Project Website
        # additional_links: # 이게 지금 
        #   - title:  sproogen/modern-resume-theme
        #     icon: fab fa-github
        #     url: github.com/sproogen/modern-resume-theme
