        #   This is probably one of the greatest apps ever created, if you don't agree you're probably wrong. 
        description: | # this will include new lines to allow paragraphs
          고객의 서비스 이용 데이터를 기반으로 인터넷 유형을 예측하는 <mark>머신러닝</mark> 프로젝트입니다.
          <mark>MLflow Nested Run</mark>을 활용해 실험 과정을 구조화하고, feature selection부터 hyperparameter tuning까지의 의사결정을 자동화했습니다.
          
    content:
      - layout: top-middle
        title: AI 기반 뉴스 숏폼 자동 생성 파이프라인
        link: https://github.com/jskimofs/shortform_auto_generator
        # link_text: Project Website
        # additional_links:
        #   - title:  sproogen/modern-resume-theme
        #     icon: fab fa-github
        #     url: github.com/sproogen/modern-resume-theme
          # - title:  Github page for project (eg. sproogen/modern-resume-theme)
          #   icon: fab fa-github
          #   url: Link to project (eg. sproogen.github.io/modern-resume-theme)
        # quote: >
        #   This is probably one of the greatest apps ever created, if you don't agree you're probably wrong. 
        description: | # this will include new lines to allow paragraphs
          뉴스 영상에서 STT 기반으로 텍스트를 추출하고, <mark>LLM</mark>을 활용해 요약 및 장르를 생성한 뒤, 유사도 기반으로 핵심 구간을 선택해 숏폼 영상을 자동 생성하는 파이프라인을 구축했습니다.
          전 과정을 모듈화하여 확장성과 유지보수성을 고려한 구조로 설계했습니다.
