about_content: | # this will include new lines to allow paragraphs
  비구조적으로 작성된 데이터 처리 및 머신러닝 코드를, 재현 가능하고 서비스 가능한 시스템으로 전환하는 데 강점을 가지고 있습니다.
  Whisper 기반 STT부터 텍스트 후처리, 요약 및 하이라이트 추출, 영상 생성까지 이어지는 end-to-end 파이프라인을 설계하고 구현하여 실제 결과물로 연결했습니다.
  또한 MLflow를 활용해 실험 과정을 구조화하고, 파이프라인 기반 학습과 모델 직렬화를 통해 모델을 서비스 환경에 적용 가능한 형태로 개선했습니다.

